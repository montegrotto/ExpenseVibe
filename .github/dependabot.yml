version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-deps:
        update-types: ["minor", "patch"]
    ignore:
      # Medvetet på Django 5.2 LTS (stöd till april 2028)
      - dependency-name: "django"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      frontend-deps:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Django 5.2 LTS stödjer Python 3.10-3.14, inte nyare
      - dependency-name: "python"
        versions: [">=3.15"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        update-types: ["major", "minor", "patch"]
