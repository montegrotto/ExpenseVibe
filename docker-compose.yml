services:
  web:
    # Färdigbyggd image från Docker Hub (amd64/arm64). pull_policy gör att
    # `docker compose up` hämtar den i stället för att bygga när den saknas
    # lokalt; `docker compose up --build` bygger från Dockerfile under samma namn.
    image: montegrotto/expensevibe:${EXPENSEVIBE_VERSION:-latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "0"
      # Fast till reinvgrabber-tjänsten nedan (samma compose-nätverk) - se
      # attachments/extraction_client.py: en tom URL stänger av
      # integrationen helt.
      REINVGRABBER_URL: http://reinvgrabber:5001
    volumes:
      - expensevibe-data:/data
      - static-assets:/app/staticfiles
      - media-assets:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/konto/logga-in/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      # web kör migrate och kopierar in statiska filer i entrypointen innan
      # gunicorn ens startar - på en långsam disk (t.ex. Docker Desktop på
      # macOS med volymer) kan det ta längre än interval*retries. Fel under
      # start_period räknas inte mot retries, bara sådana EFTER den, så en
      # långsam men fungerande uppstart hinner bli klar istället för att
      # markeras unhealthy i onödan.
      start_period: 40s
    expose:
      - "8000"
    restart: unless-stopped

  # Separat program (eget repo, egen Python-version) som föreslår
  # bokförings-/betalningsfält ur uppladdade bilagor med lokal OCR - se
  # attachments/extraction_client.py för varför den INTE körs i samma
  # process som web.
  reinvgrabber:
    image: montegrotto/reinvgrabber:0.1
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - "5001"
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - expensevibe-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expensevibe -d expensevibe"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    configs:
      - source: nginx_conf
        target: /etc/nginx/conf.d/default.conf
    volumes:
      - static-assets:/static:ro
      - media-assets:/media:ro
    restart: unless-stopped

volumes:
  expensevibe-data:
  expensevibe-postgres:
  static-assets:
  media-assets:

# Inline så att en driftsättning bara behöver den här filen och .env
# (Compose >= 2.23.1). En bind-mount av ./nginx/default.conf blev en tom
# root-ägd KATALOG när filen saknades på servern och nginx startade aldrig.
# nginx-variabler skrivs $$namn eftersom Compose själv interpolerar $namn.
configs:
  nginx_conf:
    content: |
      # Bakom en TLS-terminerande proxy (t.ex. nginx-proxy-manager/Cloudflare)
      # är nginx egen $$scheme alltid http; skicka vidare det proxyn
      # rapporterade så Django (SECURE_PROXY_SSL_HEADER) ser requesten som
      # säker och bygger https-länkar.
      map $$http_x_forwarded_proto $$expensevibe_forwarded_proto {
          default $$scheme;
          https   https;
      }

      server {
          listen 80;
          server_name _;

          client_max_body_size 15m;

          # Ett statiskt `upstream { server web:8000; }`-block slår upp "web" EN
          # gång när nginx startar - hinner web-containern inte registrera sig i
          # Dockers nätverk än (t.ex. vid en kallstart av hela stacken) kraschar
          # nginx direkt med "host not found in upstream" och startar aldrig om
          # av sig själv. 127.0.0.11 är Dockers inbyggda DNS-server på det
          # nätverk Compose skapar; med resolver + variabel i proxy_pass slås
          # "web" upp lat per request istället, så nginx alltid startar och bara
          # enstaka tidiga requests (innan web hunnit bli klar) får 502.
          resolver 127.0.0.11 valid=30s;

          location /static/ {
              alias /static/;
              access_log off;
              expires 30d;
              add_header Cache-Control "public, max-age=2592000";
          }

          # /media/ serveras medvetet INTE av nginx - bilagorna (kvitton) är
          # känsliga och hämtas bara via Djangos behörighetsskyddade vyer
          # (attachments:file/attachments:thumbnail, export:export_download).

          location / {
              set $$upstream_web web:8000;
              proxy_pass http://$$upstream_web;
              proxy_http_version 1.1;
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$expensevibe_forwarded_proto;
              proxy_set_header X-Forwarded-Host $$http_host;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_redirect off;
          }
      }
