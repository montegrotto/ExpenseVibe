{% extends "base.html" %}
{% block title %}Ta bort utlägg – ExpenseVibe{% endblock %}
{% block page_title %}Ta bort utlägg{% endblock %}
{% block nav_expense_list %}active{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <p>Ta bort utlägget <strong>{{ expense.description }}</strong>?</p>
        <form method="post">
          {% csrf_token %}
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Ta bort</button>
            <a href="{% url 'expenses:expense_detail' expense.pk %}" class="btn btn-outline-secondary">Avbryt</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
