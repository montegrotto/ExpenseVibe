server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    # Ett statiskt `upstream { server web:8000; }`-block slår upp "web" EN
    # gång när nginx startar - hinner web-containern inte registrera sig i
    # Dockers nätverk än (t.ex. vid en kallstart av hela stacken) kraschar
    # nginx direkt med "host not found in upstream" och startar aldrig om
    # av sig själv. 127.0.0.11 är Dockers inbyggda DNS-server på det
    # nätverk Compose skapar; med resolver + variabel i proxy_pass slås
    # "web" upp lat per request istället, så nginx alltid startar och bara
    # enstaka tidiga requests (innan web hunnit bli klar) får 502.
    resolver 127.0.0.11 valid=30s;

    location /static/ {
        alias /static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # /media/ serveras medvetet INTE av nginx - bilagorna (kvitton) är
    # känsliga och hämtas bara via Djangos behörighetsskyddade vyer
    # (attachments:file/attachments:thumbnail, export:export_download).

    location / {
        set $upstream_web web:8000;
        proxy_pass http://$upstream_web;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect off;
    }
}
